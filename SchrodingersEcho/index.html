<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schrödinger's Echo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <h1>SCHRÖDINGER'S ECHO</h1>
        <div class="instructions">
            <p><strong>WASD / ZQSD</strong> : Déplacer</p>
            <p><strong>SHIFT</strong> : Division Quantique (Créer un fantôme)</p>
            <p><strong>TAB</strong> : Changer de focus</p>
            <p><strong>ESPACE</strong> : Effondrement Quantique (Garder le fantôme ciblé)</p>
            <p><strong>R</strong> : Recommencer</p>
        </div>
        <div id="levelInfo">Niveau 1: L'Éveil</div>
    </div>
