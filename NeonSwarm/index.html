<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Swarm</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="top-bar">
            <div id="xp-bar-container">
                <div id="xp-bar-fill"></div>
            </div>
            <div id="level-display">LVL 1</div>
        </div>

        <div id="stats">
            <span id="score">Score: 0</span>
            <span id="timer">00:00</span>
            <span id="fps">FPS: 60</span>
        </div>

        <!-- Ecran de Level Up -->
        <div id="level-up-screen" class="hidden">
            <h1 class="glow-text">LEVEL UP!</h1>
            <h2 id="new-level-title">Niveau 2</h2>
            <div id="upgrades-container">
                <!-- Les cartes d'upgrade seront injectées ici -->
            </div>
        </div>
        
        <!-- Ecran de Game Over -->
        <div id="game-over-screen" class="hidden">
            <h1 class="glow-text error">SYSTEM FAILURE</h1>
            <h2>Survie : <span id="final-time">00:00</span></h2>
            <h3>Score : <span id="final-score">0</span></h3>
            <button id="btn-restart" class="neon-button">REBOOT</button>
        </div>
    </div>

    <script src="js/MathUtils.js"></script>
    <script src="js/Input.js"></script>
    <script src="js/Particles.js"></script>
    <script src="js/Renderer.js"></script>
    <script src="js/Player.js"></script>
    <script src="js/Enemy.js"></script>
    <script src="js/Weapons.js"></script>
    <script src="js/Drops.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
